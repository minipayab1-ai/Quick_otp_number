[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-otp-number"
version = "1.0.0"
description = "Production Telegram OTP marketplace bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "SQLAlchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "APScheduler>=3.11,<4",
  "croniter>=6,<7",
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
